services:
  postgres:
    image: postgres:16-alpine
    container_name: simbg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: simbg
      POSTGRES_USER: simbg
      POSTGRES_PASSWORD: simbg
    ports:
      - "35001:5432"
    volumes:
      - simbg-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simbg -d simbg"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  simbg-postgres-data:
    driver: local
